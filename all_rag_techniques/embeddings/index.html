<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Recipe Embeddings Visualization</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            overflow: hidden;
            background: linear-gradient(135deg, #1e1e2e 0%, #2d1b69 50%, #1a1a2e 100%);
            color: #ffffff;
        }

        /* Header with glassmorphism card */
        header {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            width: 90%;
            max-width: 600px;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 20px 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 15px;
            text-align: center;
            background: linear-gradient(90deg, #ff6b35, #f7931e, #feca57);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .search-container {
            position: relative;
        }

        #searchInput {
            width: 100%;
            padding: 12px 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
        }

        #searchInput::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        #searchInput:focus {
            border-color: #ff6b35;
            background: rgba(255, 255, 255, 0.1);
        }

        /* Canvas container */
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        canvas {
            display: block;
            cursor: grab;
        }

        canvas:active {
            cursor: grabbing;
        }

        /* Tooltip */
        #tooltip {
            position: absolute;
            background: rgba(0, 0, 0, 0.95);
            color: #ffffff;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 400;
            pointer-events: none;
            z-index: 1000;
            display: none;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 350px;
            line-height: 1.5;
        }

        #tooltip.visible {
            display: block;
        }

        #tooltip .tooltip-title {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 6px;
            color: #feca57;
        }

        #tooltip .tooltip-field {
            margin: 4px 0;
            font-size: 12px;
        }

        #tooltip .tooltip-label {
            color: #aaaaaa;
            font-weight: 500;
        }

        #tooltip .tooltip-value {
            color: #ffffff;
        }

        /* Instructions panel */
        .instructions {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            padding: 15px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 13px;
            line-height: 1.6;
            max-width: 300px;
        }

        .instructions h3 {
            font-size: 14px;
            margin-bottom: 8px;
            color: #feca57;
        }

        .instructions ul {
            list-style: none;
            padding-left: 0;
        }

        .instructions li {
            margin-bottom: 6px;
            padding-left: 20px;
            position: relative;
        }

        .instructions li:before {
            content: "→";
            position: absolute;
            left: 0;
            color: #ff6b35;
        }

        /* Legend panel */
        .legend {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            padding: 15px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 13px;
            line-height: 1.6;
            max-width: 250px;
        }

        .legend h3 {
            font-size: 14px;
            margin-bottom: 10px;
            color: #feca57;
        }

        .legend-items {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 6px rgba(255, 255, 255, 0.3);
        }

        /* Loading indicator */
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 999;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #ff6b35;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #loading p {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.8);
        }

        /* Responsive design */
        @media (max-width: 768px) {
            header {
                width: 95%;
            }

            h1 {
                font-size: 20px;
            }

            .card {
                padding: 15px 20px;
            }

            .instructions {
                font-size: 11px;
                max-width: 250px;
                padding: 12px 15px;
            }

            .legend {
                font-size: 11px;
                max-width: 200px;
                padding: 12px 15px;
            }

            .legend-items {
                gap: 6px;
            }

            .legend-color {
                width: 12px;
                height: 12px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="card">
            <h1 id="datasetTitle">📊 Dataset Embeddings Explorer</h1>
            <div class="search-container">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Search items..."
                    autocomplete="off"
                >
            </div>
        </div>
    </header>

    <div id="canvas-container"></div>

    <div id="tooltip"></div>

    <div class="instructions">
        <h3>How to use:</h3>
        <ul>
            <li>Drag to rotate view</li>
            <li>Scroll to zoom</li>
            <li>Hover for recipe name</li>
            <li>Click to see 5 nearest neighbors</li>
            <li>Click background to reset</li>
        </ul>
    </div>

    <div class="legend">
        <h3>Categories:</h3>
        <div class="legend-items" id="legendItems">
            <!-- Categories will be populated dynamically by JavaScript -->
        </div>
    </div>

    <div id="loading">
        <div class="spinner"></div>
        <p>Loading embeddings...</p>
    </div>

    <!-- Three.js from node_modules -->
    <script type="importmap">
        {
            "imports": {
                "three": "./node_modules/three/build/three.module.js",
                "three/addons/": "./node_modules/three/examples/jsm/"
            }
        }
    </script>

    <!-- Main application logic -->
    <script type="module" src="./js/main.js"></script>
</body>
</html>
